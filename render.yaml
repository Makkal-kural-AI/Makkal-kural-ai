services:
  - type: web
    name: makkal-kural-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: WHISPER_MODEL
        value: tiny
